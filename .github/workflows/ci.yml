name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Flutter version as vercel.json, so CI and the deployed build agree.
      # Newer Flutter releases deprecate package:flutter/material.dart, which
      # would fail `flutter analyze` on every file until the app is migrated.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
